<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- City skyline background -->
  <rect width="100" height="100" fill="#1a1a1a"/>
  
  <!-- Buildings -->
  <rect x="10" y="50" width="12" height="40" fill="#667eea"/>
  <rect x="26" y="40" width="12" height="50" fill="#8b5cf6"/>
  <rect x="42" y="30" width="16" height="60" fill="#ec4899"/>
  <rect x="62" y="45" width="12" height="45" fill="#10b981"/>
  <rect x="78" y="35" width="12" height="55" fill="#f59e0b"/>
  
  <!-- Windows on buildings -->
  <rect x="12" y="55" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="16" y="55" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="12" y="60" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="16" y="60" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  
  <rect x="28" y="45" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="32" y="45" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="36" y="45" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="28" y="50" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="32" y="50" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  
  <rect x="45" y="35" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="50" y="35" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="55" y="35" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="45" y="40" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="50" y="40" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="55" y="40" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  
  <rect x="64" y="50" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="68" y="50" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="72" y="50" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  
  <rect x="80" y="40" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="84" y="40" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="88" y="40" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="80" y="45" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  <rect x="84" y="45" width="2" height="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- Moon/Star -->
  <circle cx="75" cy="20" r="4" fill="#fbbf24" opacity="0.9"/>
  <circle cx="20" cy="15" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="25" cy="12" r="0.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="30" cy="18" r="1" fill="#ffffff" opacity="0.8"/>
</svg>





